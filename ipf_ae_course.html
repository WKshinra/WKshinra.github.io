<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>特発性肺線維症 急性増悪 入院の21日間</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1F2430; --muted:#5C6373; --line:#D6DAE2;
  --violet:#4A2C82; --violet-soft:#ECE6F7; --on-violet:#FFFFFF; --safranin:#C0396B;
  --ok:#1E7A55; --ok-soft:#E3F3EA; --ng:#B23A2E; --ng-soft:#FBE7E4;
  --eyepiece:#1D1A24;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1726; --surface:#241F33; --ink:#E8E6EE; --muted:#A8A3B8; --line:#3A3350;
    --violet:#B9A2F0; --violet-soft:#2F2747; --on-violet:#1B1726; --safranin:#F08AAE;
    --ok:#6FD3A6; --ok-soft:#1D3A2F; --ng:#FF8A7A; --ng-soft:#41231F;
    --eyepiece:#0F0D15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1726; --surface:#241F33; --ink:#E8E6EE; --muted:#A8A3B8; --line:#3A3350;
  --violet:#B9A2F0; --violet-soft:#2F2747; --on-violet:#1B1726; --safranin:#F08AAE;
  --ok:#6FD3A6; --ok-soft:#1D3A2F; --ng:#FF8A7A; --ng-soft:#41231F;
  --eyepiece:#0F0D15;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{touch-action:manipulation}
.wrap{max-width:680px;margin:0 auto;padding:18px 18px 32px}

/* ステータスバー */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hud-in{max-width:680px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.lives{display:flex;gap:4px}
.heart{width:26px;height:26px;color:var(--safranin);display:block}
.heart svg{width:100%;height:100%;display:block;fill:currentColor}
.heart.empty{color:var(--muted);opacity:.5}
.heart.empty svg{fill:none;stroke:currentColor;stroke-width:1.8}
.heart.lost{animation:lose .55s ease-out}
.heart.gain{animation:pop .5s ease-out}
@keyframes lose{0%{transform:scale(1.3);opacity:1}45%{transform:scale(.6) rotate(-14deg)}100%{transform:none}}
.trust{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.tbar{width:58px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tfill{display:block;height:100%;width:30%;background:var(--violet);transition:width .5s ease-out}
.tnum{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:1.7em}
.trust.up .tbar{animation:glow .7s ease-out}
.trust.down{animation:shake .4s}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 7px transparent}}
.scorebox{margin-left:auto;display:flex;align-items:center;gap:8px}
.combo{font-size:.75rem;font-weight:700;color:var(--on-violet);background:var(--violet);padding:2px 9px;border-radius:999px;white-space:nowrap;visibility:hidden}
.combo.on{visibility:visible}
.combo.pop{animation:pop .4s ease-out}
.score{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.pts{font-size:.8rem;color:var(--muted);margin-left:-4px}
.mute{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem;cursor:pointer;display:grid;place-items:center}
.mute:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:none}}

/* タイトル */
.title{padding-top:24px}
.title h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.3;margin:0}
.motif{display:block;width:150px;height:auto;margin:14px 0 16px}
.motif .v{fill:var(--violet)} .motif .s{fill:var(--safranin)}
.title .sub{color:var(--muted);margin:0 0 8px}
.mode{border-top:1px solid var(--line);padding:18px 0 4px}
.mode h2{font-family:var(--serif);font-weight:600;font-size:1.35rem;margin:0}
.mode p{margin:4px 0 0}
.mode .best{color:var(--muted);font-size:.88rem;margin-top:8px}
.mode .best b{color:var(--ink);font-variant-numeric:tabular-nums}
.common{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:.88rem;color:var(--muted)}
.common p{margin:0 0 6px}

/* ストーリー */
.chapter{min-height:58vh;display:flex;flex-direction:column;justify-content:center;padding:16px 2px}
.chapter .day{color:var(--muted);margin:0;font-size:.95rem}
.chapter h2{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,10vw,3rem);line-height:1.3;margin:6px 0 6px;animation:settle 1.1s ease-out both}
@keyframes settle{from{opacity:0;letter-spacing:.35em;filter:blur(3px)}to{opacity:1;letter-spacing:.02em;filter:none}}
.chapter .place{color:var(--violet);font-weight:700;margin:0}
.chapter .motif{margin:18px 0 0}
.scene{cursor:pointer;-webkit-tap-highlight-color:transparent}
.log{display:grid;gap:14px}
.talk{display:flex;gap:10px;align-items:flex-start;animation:rise .3s ease-out}
.talk.me{flex-direction:row-reverse}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.2rem;background:var(--surface)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 14px 9px;max-width:calc(100% - 54px)}
.talk.me .bubble{border-radius:14px 4px 14px 14px;background:var(--violet-soft)}
.who{font-size:.78rem;font-weight:700;color:var(--c);margin:0}
.who small{font-weight:500;color:var(--muted);margin-left:6px}
.say{margin:2px 0 0;min-height:1.75em}
.narr{font-family:var(--serif);font-weight:600;color:var(--muted);margin:2px;line-height:1.95;animation:rise .4s ease-out}
.dtag{font-size:.72rem;font-weight:700;margin-left:8px}
.dtag.ok{color:var(--ok)} .dtag.ng{color:var(--ng)}
.fb .talk{margin:10px 0 12px}

/* 問題 */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 20px}
.q.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.qtop{display:flex;align-items:center;gap:8px;font-size:.82rem}
.qno{color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.75rem;font-weight:700;color:var(--violet);border:1.5px solid currentColor;border-radius:999px;padding:0 9px;line-height:1.6;flex:none}
.bonus{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 14px}
.gauge-fill{height:100%;background:var(--violet);transform-origin:left center}
.gauge-fill.low{background:var(--safranin)}
.story{font-family:var(--serif);font-weight:600;font-size:clamp(1.08rem,4vw,1.28rem);line-height:1.85;margin:0 0 12px}
.monitor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 14px}
.vital{background:var(--surface);padding:6px 10px 8px;display:flex;flex-direction:column}
.vital .k{font-size:.74rem;color:var(--muted)}
.vital .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4}
.vital .v small{font-size:.7rem;font-weight:500;color:var(--muted);margin-left:3px}
@media (min-width:600px){.monitor{grid-template-columns:repeat(6,minmax(0,1fr))}}
.qtext{font-size:1.1rem;line-height:1.6;margin:0}
.scope{background:var(--eyepiece);border-radius:16px;padding:16px 14px 10px;margin:0 0 14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.scope svg{width:100%;max-width:280px;height:auto;display:block}
.scope figcaption{color:#CFC8DA;font-size:.78rem}
.opts{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;line-height:1.6;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px;transition:border-color .15s,background-color .15s}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .key{flex:none;width:1.75em;height:1.75em;margin-top:.05em;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.opt .txt{flex:1}
.opt .tag{flex:none;font-size:.75rem;font-weight:700;align-self:center}
.opt.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-correct .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-correct .tag{color:var(--ok)}
.opt.is-wrong{border-color:var(--ng);background:var(--ng-soft)}
.opt.is-wrong .key{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.opt.is-wrong .tag{color:var(--ng)}
.opt.is-dim{opacity:.5}

/* 回答後 */
.fb.show{margin-top:18px;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-weight:700;font-size:1.15rem;margin:0 0 4px}
.fb-head.ok{color:var(--ok)}
.fb-head.ng{color:var(--ng)}
.calc{font-size:.8rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.fb > p{margin:0 0 8px}
.right{color:var(--ok);font-weight:700}
.over{color:var(--ng);font-weight:700}
.explain{border-left:3px solid var(--violet);padding:2px 0 2px 14px;margin-top:14px}
.explain h3{font-size:.92rem;color:var(--violet);margin:0 0 4px}
.explain p{margin:0}

.primary{display:block;margin-top:20px;width:100%;min-height:52px;border:0;border-radius:10px;background:var(--violet);color:var(--on-violet);font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.ghost{display:block;margin-top:10px;width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
.mode .primary,.mode .ghost{margin-top:12px}
.primary:focus-visible,.ghost:focus-visible{outline:3px solid var(--violet);outline-offset:3px}

/* 結果 */
.verdict{font-weight:700;font-size:1.05rem;margin:20px 0 0}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.ending{font-family:var(--serif);font-weight:600;font-size:1.25rem;margin:2px 0 0}
.final{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}
.final .big{font-family:var(--serif);font-size:3.6rem;line-height:1.1;color:var(--violet);font-variant-numeric:tabular-nums}
.final .of{font-weight:700}
.newbest{display:inline-block;background:var(--safranin);color:var(--on-violet);font-weight:700;font-size:.85rem;padding:2px 12px;border-radius:999px;margin:0 0 6px;animation:pop .5s ease-out}
.rank{margin:6px 0 0}
.rank b{font-family:var(--serif);font-size:1.45rem;font-weight:600;margin-left:6px}
.nextrank{color:var(--muted);font-size:.9rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0 0}
.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats div{background:var(--surface);padding:8px 12px}
.stats dt{font-size:.76rem;color:var(--muted)}
.stats dd{margin:0;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.result h2{font-size:1rem;margin:26px 0 4px}
.review{border-bottom:1px solid var(--line);padding:10px 0}
.review summary{cursor:pointer;display:flex;gap:8px;align-items:flex-start;list-style:none;font-weight:500}
.review summary::-webkit-details-marker{display:none}
.review summary:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:4px}
.review .body{padding:8px 0 0;font-size:.95rem}
.review .body p{margin:0 0 6px}
.empty-note{color:var(--muted);margin:4px 0 0}

/* 演出 */
.pt{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:8px 0 0 var(--violet);pointer-events:none;z-index:50;animation:fly .75s cubic-bezier(.2,.7,.3,1) forwards}
.pt.pink{background:var(--safranin);box-shadow:8px 0 0 var(--safranin)}
@keyframes fly{from{transform:translate(-50%,-50%) rotate(0deg);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r));opacity:0}}
.float{position:fixed;font-weight:700;font-size:1.2rem;color:var(--ok);pointer-events:none;z-index:40;transform:translate(-50%,0);animation:floatup .9s ease-out forwards;font-variant-numeric:tabular-nums}
@keyframes floatup{to{transform:translate(-50%,-52px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:30;background:var(--violet);color:var(--on-violet);font-weight:700;padding:10px 20px;border-radius:999px;white-space:nowrap;transition:opacity .25s,transform .25s}
.toast.heal{background:var(--ok)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.note{max-width:680px;margin:0 auto;padding:0 18px 28px;color:var(--muted);font-size:.8rem;line-height:1.6}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}

/* ===== この症例用の追加スタイル ===== */
.alert-tag{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--on-violet);background:var(--safranin);padding:2px 12px;border-radius:999px;margin:0 0 10px}
.chapter.alert .place{color:var(--safranin)}
.teach{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.92rem;cursor:pointer}
.teach input,.evlist input{accent-color:var(--violet);width:1.05em;height:1.05em;flex:none}
.evlist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.evlist input{margin-top:.4em}
#teachbox{margin-top:8px}
.evlist{list-style:none;margin:6px 0 0;padding:0 0 0 4px;border-left:2px solid var(--line)}
.evlist label{padding:5px 0 5px 10px}
.evlist small{display:block;color:var(--muted);font-size:.8rem}
.evlog{list-style:none;margin:6px 0 0;padding:0}
.evlog li{border-bottom:1px solid var(--line);padding:8px 0}
.evlog b{display:block}
.evlog span{color:var(--muted);font-size:.88rem}
.labs{display:flex;flex-wrap:wrap;gap:2px 20px;margin:14px 0 4px;font-size:.95rem}
.labs div{display:flex;gap:6px}
.labs dt{color:var(--muted)}
.labs dd{margin:0;font-variant-numeric:tabular-nums}
.meters{display:flex;gap:10px}
.meter{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted)}
.mbar{width:46px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.mfill{display:block;height:100%;width:50%;background:var(--ok);transition:width .5s ease-out}
.mfill.safe{background:var(--violet)}
.meter.up .mbar{animation:glow .7s ease-out}
.meter.down{animation:shake .4s}

.round{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 20px}
.rlabel{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0 0 12px}
.round .labs{margin:0 0 14px}
.rh{font-size:.9rem;color:var(--muted);margin:16px 0 8px}
.notes{margin:12px 0 0;padding-left:1.2em;font-size:.95rem}
.notes li{margin:2px 0}
.q .labs{margin:-4px 0 14px}

.ausc{margin:0 0 14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px 6px;background:var(--surface)}
.ausc figcaption{display:flex;flex-direction:column;line-height:1.5}
.ausc .site{font-size:.76rem;color:var(--muted)}
.ausc figcaption b{font-size:.98rem}
.ausc figcaption span:last-child{font-size:.85rem;color:var(--muted)}
.ausc svg{display:block;width:100%;max-width:420px;height:auto;margin-top:4px}
.ausc .ph{font-size:9px;fill:var(--muted)}
.ausc .bl{font-size:10px;fill:var(--ink);font-weight:700}
.ausc .none{font-size:11px;fill:var(--ok);font-weight:700}
.ausc .div{stroke:var(--line);stroke-dasharray:2 3}
.ausc .ib{fill:var(--violet-soft);stroke:var(--violet);stroke-width:1.2}
.ausc .eb{fill:var(--line)}
.ausc .ck{fill:var(--safranin)}
.ausc .wz{stroke:var(--safranin);fill:none;stroke-linejoin:round;stroke-linecap:round}
.ausc .rl{font-size:10px;fill:var(--muted)}

.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spark{border:1px solid var(--line);border-radius:10px;padding:6px 8px 2px;background:var(--surface)}
.sk{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:.74rem;color:var(--muted);margin:0}
.sk b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.spark svg{display:block;width:100%;height:auto}
.spark .ax{stroke:var(--line)}
.spark .ref{stroke:var(--safranin);stroke-dasharray:3 3;opacity:.7}
.spark .ln{stroke:var(--violet);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.spark .dt{fill:var(--violet)}
.spark .dt.last{fill:var(--surface);stroke:var(--violet);stroke-width:2.2}
.spark .xl{font-size:9px;fill:var(--muted)}
.spark .xl.fut{opacity:.35}
.cnote{font-size:.76rem;color:var(--muted);margin:6px 0 0}

.sus{width:100%;border-collapse:collapse;font-size:.9rem;line-height:1.5}
.sus caption{text-align:left;font-weight:700;margin-bottom:6px}
.sus th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.sus td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sus td:nth-child(2),.sus td:last-child,.sus th{white-space:nowrap}
.sus .S{color:var(--ok);font-weight:700}
.sus .R{color:var(--ng);font-weight:700}
.tablewrap{overflow-x:auto;margin:0 0 14px}
.rules{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start}
.rules .ic{flex:none;width:2.8em;text-align:center;font-weight:700;color:var(--violet);font-size:.85rem;padding-top:.2em}
</style>
</head>
<body>
<header class="hud" id="hud" hidden>
  <div class="hud-in">
    <div class="meters">
      <div class="meter" id="m-rec" role="img" aria-label="回復"><span>回復</span><span class="mbar"><span class="mfill" id="f-rec"></span></span></div>
      <div class="meter" id="m-safe" role="img" aria-label="安全"><span>安全</span><span class="mbar"><span class="mfill safe" id="f-safe"></span></span></div>
    </div>
    <div class="scorebox">
      <span class="score" id="score">0</span><span class="pts">点</span>
    </div>
    <button class="mute" id="mute" type="button"></button>
  </div>

function tone(freq, start, dur, type = "triangle", vol = 0.15){

  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}

function floatText(text, x, y){
  if (reduceMotion) return;
  const f = document.createElement("span");
  f.className = "float"; f.textContent = text;
  f.style.left = x + "px"; f.style.top = (y - 10) + "px";

function animateNumber(el, from, to, ms){
  if (reduceMotion || ms <= 0){ el.textContent = to.toLocaleString(); return; }
  const t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e).toLocaleString();
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const toastEl = $("#toast"); let toastQ = [], toastBusy = false;
function toast(msg){ toastQ.push(msg); if (!toastBusy) nextToast(); }

  const msg = toastQ.shift(); if (!msg){ toastBusy = false; return; }
  toastBusy = true; toastEl.textContent = msg; toastEl.className = "toast show"; SFX.rank();
  setTimeout(() => { toastEl.className = "toast"; setTimeout(nextToast, 260); }, 1600);
}

      <text class="bl" x="${(e0 + e1) / 2}" y="82" text-anchor="middle">呼気</text>
    </svg>
  </figure>`;
}

function chartHTML(upto){
  const W = 160, H = 80, L = 12, R = 148, T = 8, B = 60;
  const xmax = TREND.x[TREND.x.length - 1];
  const xs = TREND.x.map(d => L + (R - L) * d / xmax);
  const cards = TREND.series.map(s => {
    const y = v => (B - (B - T) * (v - s.min) / (s.max - s.min)).toFixed(1);
    const pts = s.vals.slice(0, upto + 1).map((v, i) => [xs[i].toFixed(1), y(v)]);
    const ref = s.ref != null ? `<line class="ref" x1="${L}" x2="${R}" y1="${y(s.ref)}" y2="${y(s.ref)}"/>` : "";
    return `<div class="spark"><p class="sk">${s.name}<span><b>${s.fmt(s.vals[upto])}</b>${s.unit}</span></p>
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <line class="ax" x1="${L}" x2="${R}" y1="${B}" y2="${B}"/>${ref}
        ${xs.map((x, i) => `<text class="xl${i > upto ? " fut" : ""}" x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle">${TREND.labels[i]}</text>`).join("")}
        ${pts.length > 1 ? `<polyline class="ln" points="${pts.map(p => p.join(",")).join(" ")}"/>` : ""}
        ${pts.map((p, i) => `<circle class="dt${i === upto ? " last" : ""}" cx="${p[0]}" cy="${p[1]}" r="${i === upto ? 3.6 : 2.6}"/>`).join("")}
      </svg></div>`;
  }).join("");
  const desc = TREND.series.map(s => `${s.name} ${s.vals.slice(0, upto + 1).map(s.fmt).join("→")}${s.unit}`).join("、");
  return `<div class="charts" role="img" aria-label="経過グラフ。${desc}">${cards}</div>${upto >= 1 ? `<p class="cnote">${TREND.note}</p>` : ""}`;
}

function visualHTML(v){
  if (!v) return "";
  const [k, arg] = v.split(":");
  if (k === "ausc") return auscHTML(arg);
  if (k === "chart") return chartHTML(+arg);
  return "";
}

/* ---------- 会話 ---------- */
function talkHTML(who, text, extra = ""){
  if (who === "narr") return `<p class="narr">${text}</p>`;
  const c = CAST[who];
  return `<div class="talk${who === "me" ? " me" : ""}" style="--c:${c.color}">
    <span class="avatar" aria-hidden="true">${c.mark}</span>
    <div class="bubble"><p class="who">${c.name}${c.role ? `<small>${c.role}</small>` : ""}${extra}</p><p class="say">${text}</p></div>
  </div>`;
}
let typing = null;
function typeInto(el, text){
  if (reduceMotion){ el.textContent = text; return; }
  let i = 0; el.textContent = "";
  const id = setInterval(() => {
    i++; el.textContent = text.slice(0, i);
    if (i >= text.length){ clearInterval(id); typing = null; }
  }, TYPE_MS);
  typing = { finish(){ clearInterval(id); el.textContent = text; typing = null; } };
}

/* ---------- タイトル画面 ---------- */
function renderTitle(){
  hud.hidden = true;
  const best = +store.get(BEST_KEY) || 0;
  const picks = loadPicks();
  app.innerHTML = `<section class="title">
    <h1>${META.h1}</h1>
    ${motifHTML()}
    <p class="sub">${META.sub}</p>
    <ul class="rules">
      ${META.rules.map(([ic, t]) => `<li><span class="ic">${ic}</span><span>${t}</span></li>`).join("")}
      <li><span class="ic">×${COMBO_MAX.toFixed(1)}</span><span>連続正解でコンボ倍率、速く答えるほどスピードボーナス（最大+${SPEED_MAX}点）。</span></li>
    </ul>
    <p class="ranks">エンディングは「${META.rec}」と「${META.safe}」の評価、そして入院中の出来事で変わります。</p>
    <div class="mode">
      <h2>入院中の出来事</h2>
      <p>正しい判断をしていても、入院中には思わぬ出来事が起こることがあります。何が起こるかは、始めてみるまで分かりません（1回の診療で最大${MAX_EVENTS}つ）。</p>
      <label class="teach"><input type="checkbox" id="teach"><span>指導用：起こす出来事を選ぶ</span></label>
      <div id="teachbox" hidden>
        <ul class="evlist">
          ${EVENTS.map(e => `<li><label><input type="checkbox" value="${e.id}"${picks.includes(e.id) ? " checked" : ""}><span>${e.name}<small>${e.probNote}</small></span></label></li>`).join("")}
        </ul>
        <p class="cnote">選んだ出来事が必ず起こります。何も選ばなければ、出来事は起こりません。</p>
      </div>
    </div>
    ${best ? `<p class="best" style="margin-top:16px">自己ベスト <b>${best.toLocaleString()}</b> 点</p>` : ""}
    <button class="primary" id="start" type="button">診療を始める</button>
    <button class="ghost" id="mute2" type="button"></button>
  </section>`;
  $("#teach").addEventListener("change", e => { $("#teachbox").hidden = !e.target.checked; });
  setMuteLabel();
  $("#mute2").addEventListener("click", toggleMute);
  $("#start").addEventListener("click", () => {
    audio(); SFX.tap();
    const chosen = [...app.querySelectorAll('#teachbox input:checked')].map(i => i.value);
    store.set(EV_KEY, JSON.stringify(chosen));
    newGame($("#teach").checked ? { mode: "forced", picks: chosen } : { mode: "random", picks: [] });
  });
}

/* ---------- 進行 ---------- */
function buildSeq(){
  const seq = [];
  STORY.forEach(ch => { seq.push({ t: "chapter", ch }); ch.scenes.forEach(s => seq.push(s)); });
  seq.push({ t: "ending" });
  return seq;
}
function active(s){ return !s.cond || G.flags[s.cond]; }
function qTotal(){ return G.seq.filter(s => s.t === "q" && active(s)).length; }
function peekNext(){ for (let i = G.pos + 1; i < G.seq.length; i++){ if (active(G.seq[i])) return G.seq[i]; } return null; }
function labelFor(next){ return !next ? "結果を見る" : next.t === "q" ? "判断する" : next.t === "round" ? "回診する" : "次へ"; }
function lineText(t){ return typeof t === "function" ? t(G) : fill(t); }

function newGame(ev){
  ev = ev || { mode: "random", picks: [] };
  G = { seq: buildSeq(), pos: 0, qi: 0, flags: {}, rec: REC_START, safe: SAFE_START,
        score: 0, combo: 0, maxCombo: 0, correct: 0, missed: [], answered: false,
        t0: 0, raf: 0, limit: 30, bonus: SPEED_MAX, rankIdx: 0, ending: null,
        evMode: ev.mode, setting: ev, forced: {}, events: [], delay: 0, revealed: {} };
  if (ev.mode === "forced"){
    const count = Object.fromEntries(SLOTS.map(sl => [sl, 0]));
    EVENTS.filter(e => ev.picks.includes(e.id)).forEach(e => {
      const sl = e.window.reduce((a, b) => count[b] < count[a] ? b : a);
      count[sl]++; (G.forced[sl] = G.forced[sl] || []).push(e);
    });
  }
  hud.hidden = false;
  G.log = []; G.startedAt = Date.now();
  $("#score").textContent = "0";
  renderMeters(0, 0); setMuteLabel();
  renderStep();
  window.scrollTo(0, 0);
}

function renderStep(){
  const s = G.seq[G.pos];
  if (!s) return renderResult();
  if (!active(s)){ G.pos++; return renderStep(); }
  if (s.t === "chapter") return renderChapter(s.ch);
  if (s.t === "talk") return renderTalk(s);
  if (s.t === "round") return renderRound(s);
  if (s.t === "q") return renderQ(s);
  if (s.t === "event"){
    const fired = rollEvents(s.slot);
    const steps = [];
    fired.forEach(e => {
      const v = pickWeighted(e.variants, G);
      const rec = { id: e.id, name: e.name, variant: v.name, when: s.label, delay: v.delay, total: 0, right: 0 };
      G.events.push(rec); G.delay += v.delay;
      if (v.onStart) v.onStart(G);
      steps.push({ t: "chapter", ch: { day: s.label, place: v.place, title: v.title, alert: true } });
      v.scenes.forEach(sc => steps.push(sc.t === "q" ? { ...sc, ev: rec } : sc));
    });
    G.seq.splice(G.pos, 1, ...steps);
    return renderStep();
  }
  if (s.t === "ending"){
    const e = ENDINGS.find(x => x.when(G));
    G.ending = e.name;
    G.seq.splice(G.pos, 1, { t: "chapter", ch: EPILOGUE }, { t: "talk", lines: e.lines });
    return renderStep();
  }
}
function advance(){ G.pos++; renderStep(); toTop(); }

function rollEvents(slot){
  if (G.evMode === "none") return [];
  if (G.evMode === "forced") return G.forced[slot] || [];
  if (G.events.length >= MAX_EVENTS) return [];
  const pool = shuffle(EVENTS.filter(e => e.window.includes(slot) && !G.events.some(x => x.id === e.id)));
  // prob は入院全体での確率。起こりうる時点の数で割り振る
  for (const e of pool){ const per = 1 - Math.pow(1 - Math.min(0.99, e.prob(G)), 1 / e.window.length); if (Math.random() < per) return [e]; }
  return [];
}

function renderChapter(ch){
  app.innerHTML = `<section class="chapter${ch.alert ? " alert" : ""}">
    ${ch.alert ? `<p class="alert-tag">予期せぬ出来事</p>` : ""}
    <p class="day">${fill(ch.day)}</p>
    <h2>${fill(ch.title)}</h2>
    <p class="place">${ch.place}</p>
    ${motifHTML()}
    <button class="primary" id="go" type="button">はじめる</button>
  </section>`;
  ch.alert ? SFX.alert() : SFX.chapter();
  $("#go").addEventListener("click", () => { SFX.tap(); advance(); });
}

function renderTalk(step){
  const finalLabel = labelFor(peekNext());
  app.innerHTML = `<section class="scene" id="scene"><div class="log" id="log" aria-live="polite"></div><button class="primary" id="adv" type="button">次へ</button></section>`;
  let n = 0;
  const btn = $("#adv"), log = $("#log");
  const show = () => {
    const [who, raw] = step.lines[n++];
    const text = lineText(raw);
    log.insertAdjacentHTML("beforeend", talkHTML(who, ""));
    const el = log.lastElementChild;
    typeInto(who === "narr" ? el : el.querySelector(".say"), text);
    if (n >= step.lines.length) btn.textContent = finalLabel;
    setTimeout(() => btn.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }), 30);
  };
  $("#scene").addEventListener("click", () => {
    if (typing){ typing.finish(); return; }
    if (n < step.lines.length){ show(); return; }
    SFX.tap(); advance();
  });
  show();
}

function renderRound(step){
  const R = ROUNDS[step.day];
  app.innerHTML = `<section class="round">
    <h2 class="rlabel">${fill(R.label)}</h2>
    ${vitalsHTML(R.vitals)}
    ${labsHTML(R.labs)}
    ${R.ausc ? auscHTML(R.ausc, !!G.revealed[R.ausc]) : ""}
    <h3 class="rh">経過</h3>
    ${chartHTML(R.chart)}
    ${R.notes.length ? `<ul class="notes">${R.notes.map(n => `<li>${n}</li>`).join("")}</ul>` : ""}
    <button class="primary" id="go" type="button">${labelFor(peekNext())}</button>
  </section>`;
  $("#go").addEventListener("click", () => { SFX.tap(); advance(); });
}

function renderQ(step){
  const q = QMAP[step.id];
  const idx = q.options.map((_, i) => i);
  const order = q.fixedOrder ? idx : shuffle(idx);
  G.limit = q.timeLimit || 30;
  app.innerHTML = `<section class="q" id="qcard" aria-labelledby="qtext">
    <div class="qtop"><span class="qno">問 ${G.qi + 1} / ${qTotal()}</span><span class="chip">${q.category}</span><span class="bonus" id="bonus">ボーナス +${SPEED_MAX}</span></div>
    <div class="gauge" aria-hidden="true"><div class="gauge-fill" id="gauge"></div></div>
    ${q.case ? `<p class="story">${fill(q.case)}</p>` : ""}
    ${q.vitals ? vitalsHTML(q.vitals) : ""}
    ${visualHTML(q.visual)}
    <h2 class="qtext" id="qtext">${q.question}</h2>
    <ul class="opts">${order.map((oi, k) => `<li><button class="opt" type="button" data-oi="${oi}"><span class="key" aria-hidden="true">${KEYS[k]}</span><span class="txt">${q.options[oi].text}</span></button></li>`).join("")}</ul>
    <div class="fb" id="fb" aria-live="polite"></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(step, +b.dataset.oi, b)));
  startTimer();
}

function startTimer(){
  G.t0 = performance.now(); G.bonus = SPEED_MAX;
  const fill = $("#gauge"), lab = $("#bonus");
  const tick = now => {
    if (G.answered) return;
    const frac = Math.max(0, 1 - (now - G.t0) / 1000 / G.limit);
    fill.style.transform = `scaleX(${frac})`;
    fill.classList.toggle("low", frac < 0.3);
    const b = Math.round(SPEED_MAX * frac);
    if (b !== G.bonus){ G.bonus = b; lab.textContent = b > 0 ? `ボーナス +${b}` : "ボーナス終了"; }
    if (frac > 0) G.raf = requestAnimationFrame(tick);
  };
  G.raf = requestAnimationFrame(tick);
}

function answer(step, oi, btn){
  if (G.answered) return;
  G.answered = true; cancelAnimationFrame(G.raf);
  const q = QMAP[step.id];
  const chosen = q.options[oi], ok = !!chosen.correct, fx = chosen.fx || {};
  const bonus = Math.round(SPEED_MAX * Math.max(0, 1 - (performance.now() - G.t0) / 1000 / G.limit));
  (G.log = G.log || []).push({ qid: q.id, category: q.category, question: q.question, ok, chosen: chosen.text, seconds: Math.round((performance.now() - G.t0) / 100) / 10 });

  app.querySelectorAll(".opt").forEach(b => {
    const o = q.options[+b.dataset.oi]; b.disabled = true;
    if (o.correct){ b.classList.add("is-correct"); b.insertAdjacentHTML("beforeend", '<span class="tag">正解</span>'); }
    else if (b === btn){ b.classList.add("is-wrong"); b.insertAdjacentHTML("beforeend", '<span class="tag">あなたの回答</span>'); }
    else b.classList.add("is-dim");
  });

  if (q.visual && q.visual.startsWith("ausc:")){
    const key = q.visual.split(":")[1];
    G.revealed[key] = true;
    const lab = app.querySelector(".ausc-label");
    if (lab) lab.textContent = auscLabel(key, true);
  }
  if (step.ev){ step.ev.total++; if (ok) step.ev.right++; else { step.ev.delay++; G.delay++; } }
  const dRec = fx.rec !== undefined ? fx.rec : (ok ? REC_UP : -REC_DOWN);
  const dSafe = fx.safe || 0;
  if (fx.flag) [].concat(fx.flag).forEach(f => { G.flags[f] = true; });
  G.rec = clamp(G.rec + dRec); G.safe = clamp(G.safe + dSafe);
  renderMeters(dRec, dSafe);

  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2;
  let head = "";
  if (ok){
    G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo); G.correct++;
    const mult = multOf(G.combo), gained = Math.round((BASE + bonus) * mult), prev = G.score;
    G.score += gained;
    animateNumber($("#score"), prev, G.score, 500);
    burst(cx, r.top + r.height / 2); floatText(`+${gained}`, cx, r.top); SFX.correct(G.combo);
    const ri = rankIndex(G.score);
    if (ri > G.rankIdx){ G.rankIdx = ri; setTimeout(() => toast(`ランクアップ！ ${RANKS[ri][1]}`), 380); }
    const multTxt = mult > 1 ? ` ×${multLabel(mult)}` : "";
    head = `<p class="fb-head ok"><span>${G.combo >= 2 ? `正解！ ${G.combo}連続` : "正解！"}</span><span>+${gained}点</span><span class="calc">（基本${BASE} + スピード${bonus}）${multTxt}</span></p>`;
  } else {
    G.combo = 0; G.missed.push({ q, chosen: oi });
    SFX.wrong();
    const card = $("#qcard");
    if (!reduceMotion){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
    head = `<p class="fb-head ng"><span>不正解</span></p>`;
  }

  const tags = [];
  if (dRec) tags.push(`<span class="dtag ${dRec > 0 ? "ok" : "ng"}">${META.rec} ${signed(dRec)}</span>`);
  if (dSafe) tags.push(`<span class="dtag ${dSafe > 0 ? "ok" : "ng"}">${META.safe} ${signed(dSafe)}</span>`);
  if (step.ev && !ok) tags.push(`<span class="dtag ng">入院 +1日</span>`);
  const react = step.react ? talkHTML(step.who || META.lead, ok ? step.react.ok : step.react.ng, tags.join("")) : "";

  const fb = $("#fb");
  fb.innerHTML = `${head}
    ${react}
    <p>${chosen.why}</p>
    ${ok ? "" : `<p class="right">正解：${correctText(q)}</p>`}
    <div class="explain"><h3>解説</h3><p>${q.explanation}</p></div>
    <button class="primary" id="next" type="button">次へ</button>`;
  fb.classList.add("show");
  $("#next").addEventListener("click", () => { SFX.tap(); G.qi++; G.answered = false; advance(); });
  setTimeout(() => fb.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" }), 60);
}

/* ---------- 結果画面 ---------- */
function renderResult(){
  hud.hidden = true;
  const best = +store.get(BEST_KEY) || 0;
  const isBest = G.score > best;
  if (isBest) store.set(BEST_KEY, String(G.score));
  const ri = rankIndex(G.score), next = RANKS[ri + 1];
  const review = G.missed.length
    ? G.missed.map(({ q, chosen }) => `<details class="review"><summary><span class="chip">${q.category}</span><span>${q.question}</span></summary>
        <div class="body">${q.case ? `<p>${q.case}</p>` : ""}<p>あなたの回答：${q.options[chosen].text}</p><p class="right">正解：${correctText(q)}</p><p>${q.explanation}</p></div></details>`).join("")
    : `<p class="empty-note">間違えた問題はありません。</p>`;
  app.innerHTML = `<section class="result">
    <p class="verdict ok">診療終了</p>
    <p class="ending">エンディング「${G.ending}」</p>
    <p class="final"><span class="big" id="final">0</span><span class="of">点</span></p>
    ${isBest ? `<p class="newbest">自己ベスト更新</p>` : ""}
    <p class="rank">ランク<b>${RANKS[ri][1]}</b></p>
    ${next ? `<p class="nextrank">「${next[1]}」まであと${(next[0] - G.score).toLocaleString()}点</p>` : ""}
    <dl class="stats four">
      <div><dt>正解</dt><dd>${G.correct} / ${G.qi}</dd></div>
      <div><dt>最大コンボ</dt><dd>${G.maxCombo}</dd></div>
      <div><dt>${META.rec}</dt><dd>${G.rec}</dd></div>
      <div><dt>${META.safe}</dt><dd>${G.safe}</dd></div>
      <div><dt>退院</dt><dd>Day ${BASE_DAY + G.delay}</dd></div>
      <div><dt>入院中の出来事</dt><dd>${G.events.length}件</dd></div>
    </dl>
    <h2>入院中の出来事</h2>
    ${G.events.length ? `<ul class="evlog">${G.events.map(e => `<li><b>${e.when}：${e.variant}</b><span>${e.total}問中${e.right}問正解、入院 +${e.delay}日</span></li>`).join("")}</ul>` : `<p class="empty-note">${G.evMode === "forced" ? "指導用の設定で、出来事は起こしませんでした。" : "今回は大きな出来事は起きませんでした。"}</p>`}
    <p class="nextrank" style="margin-top:8px">自己ベスト ${Math.max(best, G.score).toLocaleString()}点</p>
    <div id="fb-mount"></div>
    <h2>間違えた問題の復習</h2>
    ${review}
    <button class="primary" id="again" type="button">もう一度診療する</button>
    <button class="ghost" id="home" type="button">タイトルに戻る</button>
  </section>`;
  animateNumber($("#final"), 0, G.score, 900);
  if (window.Feedback) Feedback.mount($("#fb-mount"), {
    caseId: META.id, caseTitle: META.title,
    mode: G.evMode === "forced" ? "指導用（出来事を指定）" : "通常",
    score: G.score, correct: G.correct, total: G.qi, maxCombo: G.maxCombo,
    meters: `${META.rec} ${G.rec} / ${META.safe} ${G.safe}`,
    ending: G.ending,
    events: G.events.map(e => `${e.when}：${e.variant}（${e.right}/${e.total}）`).join("、"),
    discharge: `Day ${BASE_DAY + G.delay}`,
    minutes: Math.round((Date.now() - G.startedAt) / 6000) / 10,
    answers: G.log || []
  });
  SFX.clear();
  $("#again").addEventListener("click", () => { SFX.tap(); newGame(G.setting); });
  $("#home").addEventListener("click", () => { SFX.tap(); renderTitle(); window.scrollTo(0, 0); });
}

setMuteLabel();
renderTitle();
</script>
<script src="feedback.js"></script>
